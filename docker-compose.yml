# Учебное окружение курса: PostgreSQL 17 с учебной базой hse_databases и Jupyter.
# Оба сервиса запускаются из готовых образов с Docker Hub: собирать ничего не нужно.
# Из чего собраны образы и как собрать их самому — в docker-compose.build.yml.
# Запуск: docker compose up -d      Остановка: docker compose down
# Логин, пароль и порты лежат в файле .env рядом.
name: hse-databases

services:
  postgres:
    image: foxleren/hse-databases-postgres:2.0.0
    container_name: hse-db-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Контейнер считается готовым, когда загружены все учебные базы: пока идёт заливка,
    # сервер не принимает подключения по сети.
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d hse_databases -c 'SELECT 1 FROM music_store.track LIMIT 1'"]
      interval: 3s
      timeout: 5s
      retries: 100

  jupyter:
    image: foxleren/hse-databases-jupyter:1.0.0
    container_name: hse-db-jupyter
    environment:
      # Внутри сети Docker база доступна по имени сервиса и своему внутреннему порту.
      PGHOST: postgres
      PGPORT: "5432"
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - .:/work
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
