# Учебное окружение курса: PostgreSQL 17 с демобазой авиаперевозок и Jupyter.
# Запуск: docker compose up -d      Остановка: docker compose down
# Логин, пароль и порты лежат в файле .env рядом.
name: hse-databases

services:
  postgres:
    build: ./db
    container_name: hse-db-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Контейнер считается готовым, когда демобаза загружена: пока идёт заливка,
    # сервер не принимает подключения по сети.
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d demo -c 'SELECT 1 FROM bookings.airports LIMIT 1'"]
      interval: 3s
      timeout: 5s
      retries: 100

  jupyter:
    build: ./jupyter
    container_name: hse-db-jupyter
    environment:
      # Внутри сети Docker база доступна по имени сервиса и своему внутреннему порту.
      PGHOST: postgres
      PGPORT: "5432"
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - .:/work
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
